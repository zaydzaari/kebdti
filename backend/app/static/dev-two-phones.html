<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kebdti · كبدتي</title>
<style>
  :root { --bg:#f6f1ea; --ink:#2b2420; --muted:#7a6e66; --accent:#b4532a; --accent2:#2f6f5e; --card:#fffdf9; --line:#e6dccf; }
  * { box-sizing: border-box; }
  body { margin:0; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; background:var(--bg); color:var(--ink); }
  header { padding:18px 28px 6px; display:flex; align-items:baseline; gap:14px; flex-wrap:wrap; }
  header h1 { margin:0; font-size:28px; letter-spacing:.5px; }
  header h1 span { color:var(--accent); font-family: "Noto Naskh Arabic", "Segoe UI", serif; }
  header p { margin:0; color:var(--muted); }
  .profile { margin:8px 28px 14px; padding:10px 14px; background:var(--card); border:1px solid var(--line); border-radius:12px;
             display:flex; gap:14px; flex-wrap:wrap; align-items:center; font-size:14px; }
  .profile label { display:flex; gap:6px; align-items:center; color:var(--muted); }
  .profile input, .profile select { font:inherit; padding:4px 6px; border:1px solid var(--line); border-radius:6px; background:#fff; }
  .phones { display:flex; gap:28px; justify-content:center; flex-wrap:wrap; padding:0 20px 30px; }
  .phone { width:390px; height:720px; background:#1d1a18; border-radius:38px; padding:12px; box-shadow:0 12px 40px rgba(0,0,0,.18); display:flex; flex-direction:column; }
  .screen { flex:1; background:var(--card); border-radius:28px; overflow:hidden; display:flex; flex-direction:column; }
  .top { padding:16px 18px 12px; border-bottom:1px solid var(--line); display:flex; gap:12px; align-items:center; }
  .avatar { width:44px; height:44px; border-radius:50%; display:grid; place-items:center; font-size:24px; background:#f1e4d6; }
  .top b { display:block; font-size:16px; } .top small { color:var(--muted); }
  .thread { flex:1; overflow-y:auto; padding:14px; display:flex; flex-direction:column; gap:10px; }
  .msg { max-width:86%; padding:10px 12px; border-radius:16px; font-size:15px; line-height:1.35; }
  .msg.me { align-self:flex-end; background:#e9f2ee; border-bottom-right-radius:4px; }
  .msg.them { align-self:flex-start; background:#f6ebe0; border-bottom-left-radius:4px; }
  .msg .ar { font-family:"Noto Naskh Arabic","Segoe UI",serif; font-size:19px; direction:rtl; text-align:right; }
  .msg .sub { color:var(--muted); font-size:12px; margin-top:4px; }
  .msg audio { width:100%; height:34px; margin-top:6px; }
  .chips { display:flex; gap:4px; flex-wrap:wrap; margin-top:6px; }
  .chip { font-size:11px; padding:2px 7px; border-radius:20px; background:#fff; border:1px solid var(--line); color:var(--muted); }
  .note { margin-top:6px; font-size:12.5px; background:#fff; border-left:3px solid var(--accent); padding:5px 8px; border-radius:6px; }
  .unsure { margin-top:6px; font-size:12px; color:#8a5a00; background:#fff4d6; padding:4px 8px; border-radius:6px; }
  .big-audio { display:flex; align-items:center; gap:10px; }
  .big-audio button { width:56px; height:56px; border-radius:50%; border:none; background:var(--accent2); color:#fff; font-size:22px; cursor:pointer; flex:none; }
  .bar { padding:10px 12px 14px; border-top:1px solid var(--line); display:flex; gap:8px; align-items:center; }
  .bar input { flex:1; font:inherit; padding:10px 12px; border:1px solid var(--line); border-radius:20px; }
  .bar button { border:none; border-radius:50%; width:46px; height:46px; font-size:20px; cursor:pointer; background:var(--accent); color:#fff; flex:none; }
  .bar button.send { background:var(--accent2); }
  .bar button.rec { animation:pulse 1s infinite; background:#c0392b; }
  .grandma .bar { justify-content:center; }
  .grandma .bar button.mic { width:84px; height:84px; font-size:34px; }
  @keyframes pulse { 50% { transform:scale(1.08); } }
  .status { font-size:12px; color:var(--muted); text-align:center; min-height:16px; padding:0 10px 4px; }
  .timing { font-size:11px; color:#aaa; margin-top:4px; }
  details { margin-top:6px; font-size:12px; color:var(--muted); }
</style>
</head>
<body>
<header>
  <h1>Kebdti <span>كبدتي</span></h1>
  <p>Translating feelings, not words, between Moroccan grandparents and their grandchildren abroad.</p>
</header>

<div class="profile">
  <b>Family profile</b>
  <label>Grandparent <select id="grandparent"><option value="grandmother">Grandmother</option><option value="grandfather">Grandfather</option></select></label>
  <label>Grandparent's name <input id="gpName" value="Mi Fatna" size="9"></label>
  <label>Family calls them <input id="address" value="أ جدة" size="7" dir="rtl"></label>
  <label>Grandchild <input id="gcName" value="Yanis" size="8"></label>
  <select id="gender"><option value="boy">boy</option><option value="girl">girl</option></select>
  <label>Language <select id="lang"><option value="fr">Français</option><option value="es">Español</option><option value="it">Italiano</option><option value="en">English</option></select></label>
</div>

<div class="phones">
  <div class="phone grandma"><div class="screen">
    <div class="top"><div class="avatar">👵</div><div><b id="gpTitle">Mi Fatna</b><small>speaks Darija · taps one button</small></div></div>
    <div class="thread" id="gpThread"></div>
    <div class="status" id="gpStatus"></div>
    <div class="bar">
      <input id="gpText" placeholder="(or type Darija for testing)" dir="rtl" style="font-size:14px">
      <button class="mic" id="gpMic" title="Hold a voice message">🎙️</button>
    </div>
  </div></div>

  <div class="phone"><div class="screen">
    <div class="top"><div class="avatar">🧑</div><div><b id="gcTitle">Yanis</b><small id="gcSub">in Lyon · Français</small></div></div>
    <div class="thread" id="gcThread"></div>
    <div class="status" id="gcStatus"></div>
    <div class="bar">
      <input id="gcText" placeholder="Écris un message…">
      <button class="send" id="gcSend" title="Send text">➤</button>
      <button class="mic" id="gcMic" title="Voice message">🎙️</button>
    </div>
  </div></div>
</div>

<script>
const $ = id => document.getElementById(id);
const LANG_LABEL = {fr:"Français", es:"Español", it:"Italiano", en:"English"};
const PLACEHOLDER = {fr:"Écris un message…", es:"Escribe un mensaje…", it:"Scrivi un messaggio…", en:"Write a message…"};

function profile() {
  return { grandparent:$("grandparent").value, address:$("address").value.trim(), grandchild_gender:$("gender").value,
           grandchild_lang:$("lang").value, grandparent_name:$("gpName").value, grandchild_name:$("gcName").value };
}
function refreshTitles() {
  $("gpTitle").textContent = $("gpName").value;
  $("gcTitle").textContent = $("gcName").value;
  $("gcSub").textContent = LANG_LABEL[$("lang").value];
  $("gcText").placeholder = PLACEHOLDER[$("lang").value];
}
["gpName","gcName","lang"].forEach(id => $(id).addEventListener("input", refreshTitles)); refreshTitles();

function esc(s) { return (s ?? "").toString().replace(/[&<>]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;"}[c])); }
function add(thread, cls, html) {
  const d = document.createElement("div"); d.className = "msg " + cls; d.innerHTML = html;
  $(thread).appendChild(d); $(thread).scrollTop = 1e9; return d;
}
function timing(r) {
  const s = r.steps || {}; const parts = [];
  if (s.asr) parts.push(`listen ${s.asr.seconds}s`); if (s.translate) parts.push(`translate ${s.translate.seconds}s`); if (s.tts) parts.push(`voice ${s.tts.seconds}s`);
  return `<div class="timing">${parts.join(" · ")} · total ${r.total_seconds}s</div>`;
}
function audioTag(url, auto) { return url ? `<audio controls ${auto ? "autoplay" : ""} src="${url}"></audio>` : ""; }

// ---------- grandparent -> grandchild
function showFromGrandparent(r) {
  // grandma's own phone: her message as a voice bubble + the Darija text
  add("gpThread", "me", `<div class="ar">${esc(r.original)}</div>`);
  // grandchild's phone: translation + voice + feelings + cultural notes
  let html = `<div>${esc(r.text)}</div>${audioTag(r.audio_url, true)}`;
  if (r.feeling?.length) html += `<div class="chips">${r.feeling.map(f => `<span class="chip">${esc(f)}</span>`).join("")}</div>`;
  (r.cultural_notes || []).forEach(n => {
    const unsure = (n.meaning || "").toLowerCase().startsWith("uncertain");
    html += unsure ? `<div class="unsure">⚠️ Kebdti isn't sure about “${esc(n.expression)}”: ${esc(n.meaning)}</div>`
                   : `<div class="note">💬 <b>${esc(n.expression)}</b>: literally “${esc(n.literal)}”, means <i>${esc(n.meaning)}</i></div>`;
  });
  if (r.confidence === "low" && !(r.cultural_notes||[]).some(n => (n.meaning||"").toLowerCase().startsWith("uncertain")))
    html += `<div class="unsure">⚠️ Kebdti isn't fully sure about this translation.</div>`;
  html += `<details><summary>Original Darija</summary><div class="ar">${esc(r.original)}</div></details>`;
  if (r.tts_error) html += `<div class="sub">voice unavailable: ${esc(r.tts_error)}</div>`;
  html += timing(r);
  add("gcThread", "them", html);
}

// ---------- grandchild -> grandparent
function showFromGrandchild(r) {
  add("gcThread", "me", `<div>${esc(r.original)}</div>`);
  // grandma can't read: big play button first, Darija text small underneath
  const html = `<div class="big-audio">${r.audio_url ? `<button onclick="this.nextElementSibling.play()">▶</button><audio src="${r.audio_url}" autoplay></audio>` : ""}
      <div class="ar">${esc(r.text)}</div></div>${r.tts_error ? `<div class="sub">voice unavailable: ${esc(r.tts_error)}</div>` : ""}${timing(r)}`;
  add("gpThread", "them", html);
}

async function send(endpoint, {audio, text}, statusId, show) {
  const fd = new FormData();
  if (audio) fd.append("audio", audio, "voice.webm");
  fd.append("text", text || "");
  fd.append("profile", JSON.stringify(profile()));
  $(statusId).textContent = audio ? "listening, translating the feeling, speaking…" : "translating the feeling, speaking…";
  try {
    const res = await fetch(endpoint, {method:"POST", body:fd});
    const r = await res.json();
    if (!res.ok || r.error) throw new Error(r.error || res.statusText);
    show(r); $(statusId).textContent = "";
  } catch (e) { $(statusId).textContent = "❌ " + e.message; }
}

// ---------- recording (tap to start, tap to stop & send)
function recorder(btnId, onDone) {
  let rec = null, chunks = [];
  $(btnId).addEventListener("click", async () => {
    if (rec && rec.state === "recording") { rec.stop(); return; }
    try {
      const stream = await navigator.mediaDevices.getUserMedia({audio:true});
      rec = new MediaRecorder(stream); chunks = [];
      rec.ondataavailable = e => chunks.push(e.data);
      rec.onstop = () => { stream.getTracks().forEach(t => t.stop()); $(btnId).classList.remove("rec"); onDone(new Blob(chunks, {type: rec.mimeType})); };
      rec.start(); $(btnId).classList.add("rec");
    } catch (e) { alert("Microphone not available: " + e.message); }
  });
}
recorder("gpMic", blob => send("/api/grandparent", {audio:blob}, "gpStatus", showFromGrandparent));
recorder("gcMic", blob => send("/api/grandchild", {audio:blob}, "gcStatus", showFromGrandchild));
$("gpText").addEventListener("keydown", e => { if (e.key === "Enter" && e.target.value.trim()) { send("/api/grandparent", {text:e.target.value}, "gpStatus", showFromGrandparent); e.target.value = ""; } });
function gcSendText() { const v = $("gcText").value.trim(); if (v) { send("/api/grandchild", {text:v}, "gcStatus", showFromGrandchild); $("gcText").value = ""; } }
$("gcSend").addEventListener("click", gcSendText);
$("gcText").addEventListener("keydown", e => { if (e.key === "Enter") gcSendText(); });
</script>
</body>
</html>
